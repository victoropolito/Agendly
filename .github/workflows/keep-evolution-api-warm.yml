name: Keep Evolution API warm

# Render's free tier spins agendly-evolution-api down after ~15min idle, and waking it back up
# can take 30-90+ seconds — bad for whoever's first to hit it (WhatsApp QR/pairing-code
# generation). Pinging it periodically during typical usage hours keeps it warm without running
# 24/7, which would eat most of the 750 free instance-hours/month shared with agendly-api on
# Render. Runs only on this public repo, where Actions minutes are unlimited/free.
on:
  schedule:
    # Every 10 minutes, 08:00-22:00 America/Sao_Paulo (UTC-3) == 11:00-00:59 UTC.
    - cron: '*/10 11-23,0 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping agendly-evolution-api
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 https://agendly-evolution-api.onrender.com/)
          echo "Response status: $status"
