# Postgres and Redis are NOT hosted on Render — Render's own free Postgres self-deletes after
# ~44 days of inactivity-free existence, which is a bad fit for a real (if low-traffic) app.
# Instead:
#   - Postgres: create TWO free projects at neon.tech (100 projects allowed for free, 0.5GB
#     storage each, no time-based deletion — auto-suspends when idle and wakes on the next
#     request). One project's database is for agendly-api's Prisma schema, the other is a
#     separate, empty database for the Evolution API server to manage on its own — mirrors
#     the two-separate-databases setup already verified working in docker-compose.yml, rather
#     than sharing one database via Postgres schemas (untested and unnecessary here).
#   - Redis: create TWO free databases at upstash.com (free tier allows up to 10 per account,
#     no card required) — one for agendly-api's BullMQ queue, one for the Evolution API's cache.
# Render itself only hosts the two web services below, both on the free plan: they spin down
# after ~15 min of inactivity (slow first request after idle) and share a 750 instance-hour/
# month cap across the workspace's free services — fine for small, infrequent traffic.
services:
  - name: agendly-api
    type: web
    runtime: node
    plan: free
    region: oregon
    buildCommand: corepack enable && corepack prepare pnpm@11.16.0 --activate && pnpm install --frozen-lockfile && pnpm --filter @agendly/api prisma:generate && pnpm exec prisma migrate deploy --schema prisma/schema.prisma && pnpm --filter @agendly/api build
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Paste the connection string Neon gives you for your project (includes ?sslmode=require —
      # keep it exactly as Neon provides it, Prisma needs SSL against Neon).
      - key: DATABASE_URL
        sync: false
      # Paste the connection string of the FIRST Upstash Redis database (used for the BullMQ queue).
      - key: REDIS_URL
        sync: false
      # Set this once the Vercel project exists (e.g. https://agendly.vercel.app).
      # Comma-separated if you add a custom domain later.
      - key: WEB_ORIGIN
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_CUSTOMER_ACCESS_SECRET
        generateValue: true
      - key: JWT_CUSTOMER_REFRESH_SECRET
        generateValue: true
      # Must match the agendly-evolution-api service's AUTHENTICATION_API_KEY exactly —
      # copy that generated value here after both services exist.
      - key: EVOLUTION_API_KEY
        sync: false
      # The agendly-evolution-api service's public URL, e.g. https://agendly-evolution-api.onrender.com
      - key: EVOLUTION_API_URL
        sync: false

  - name: agendly-evolution-api
    type: web
    runtime: image
    plan: free
    region: oregon
    image:
      url: docker.io/evoapicloud/evolution-api:latest
    envVars:
      - key: AUTHENTICATION_API_KEY
        generateValue: true
      - key: DATABASE_PROVIDER
        value: postgresql
      # Connection string of the SECOND Neon project's database (a separate, empty database
      # from agendly-api's — Evolution API creates and manages its own tables in it on boot).
      - key: DATABASE_CONNECTION_URI
        sync: false
      - key: DATABASE_SAVE_DATA_INSTANCE
        value: "true"
      - key: CACHE_REDIS_ENABLED
        value: "true"
      # Paste the connection string of the SECOND Upstash Redis database (a separate free
      # database from agendly-api's, so nothing needs to share key namespaces).
      - key: CACHE_REDIS_URI
        sync: false
      - key: CACHE_LOCAL_ENABLED
        value: "false"
      # This service's own public Render URL, filled in after first deploy.
      - key: SERVER_URL
        sync: false
