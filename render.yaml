services:
  - name: agendly-api
    type: web
    runtime: node
    plan: starter
    region: oregon
    buildCommand: corepack enable && corepack prepare pnpm@11.16.0 --activate && pnpm install --frozen-lockfile && pnpm --filter @agendly/api prisma:generate && pnpm exec prisma migrate deploy --schema prisma/schema.prisma && pnpm --filter @agendly/api build
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: agendly-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: agendly-redis
          type: keyvalue
          property: connectionString
      # Set this once the Vercel project exists (e.g. https://agendly.vercel.app).
      # Comma-separated if you add a custom domain later.
      - key: WEB_ORIGIN
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_CUSTOMER_ACCESS_SECRET
        generateValue: true
      - key: JWT_CUSTOMER_REFRESH_SECRET
        generateValue: true
      - key: WHATSAPP_TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: WHATSAPP_GRAPH_API_VERSION
        value: v21.0
      # Must match the agendly-evolution-api service's AUTHENTICATION_API_KEY exactly —
      # copy that generated value here after both services exist.
      - key: EVOLUTION_API_KEY
        sync: false
      # The agendly-evolution-api service's public URL, e.g. https://agendly-evolution-api.onrender.com
      - key: EVOLUTION_API_URL
        sync: false

  - name: agendly-evolution-api
    type: web
    runtime: image
    plan: starter
    region: oregon
    image:
      url: docker.io/evoapicloud/evolution-api:latest
    envVars:
      - key: AUTHENTICATION_API_KEY
        generateValue: true
      - key: DATABASE_PROVIDER
        value: postgresql
      # Copy agendly-postgres's "Internal Connection String" from the Render dashboard and
      # append `?schema=evolution_api` — this reuses the same database in its own Postgres
      # schema instead of provisioning a second paid database. Example:
      # postgresql://user:pass@host/agendly?schema=evolution_api
      - key: DATABASE_CONNECTION_URI
        sync: false
      - key: DATABASE_SAVE_DATA_INSTANCE
        value: "true"
      - key: CACHE_REDIS_ENABLED
        value: "true"
      # Copy agendly-redis's connection string and append `/6` (a distinct logical DB index,
      # same convention used in docker-compose.yml for local dev) so it doesn't collide with
      # the BullMQ queue agendly-api uses on the same Redis instance.
      - key: CACHE_REDIS_URI
        sync: false
      - key: CACHE_LOCAL_ENABLED
        value: "false"
      # This service's own public Render URL, filled in after first deploy.
      - key: SERVER_URL
        sync: false

  - name: agendly-redis
    type: keyvalue
    plan: starter
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: agendly-postgres
    plan: basic-1gb
    region: oregon
    databaseName: agendly
    user: agendly
