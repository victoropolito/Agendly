services:
  postgres:
    image: postgres:17-alpine
    container_name: agendly-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agendly}
      POSTGRES_USER: ${POSTGRES_USER:-agendly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-local-development}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: agendly-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: agendly-evolution-api
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-change-me-in-local-development}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:-agendly}:${POSTGRES_PASSWORD:-change-me-in-local-development}@postgres:5432/evolution_db?schema=public
      DATABASE_SAVE_DATA_INSTANCE: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_LOCAL_ENABLED: "false"
      SERVER_URL: http://localhost:8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
